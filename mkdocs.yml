site_name: Serilog in .NET
site_description: Practical guide to structured logging with Serilog
site_url: https://YOUR-ORG.github.io/YOUR-REPOSITORY/
repo_url: https://github.com/YOUR-ORG/YOUR-REPOSITORY
edit_uri: edit/main/docs/
theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Foundations:
      - What is Serilog?: foundations/what-is-serilog.md
      - Structured logging: foundations/structured-logging.md
      - Architecture and event lifecycle: foundations/architecture.md
      - Installation and first logger: foundations/installation.md
      - Levels and event writing: foundations/events.md
      - Structured data and destructuring: foundations/structured-data.md
  - Configuration:
      - Configuration basics: configuration/basics.md
      - Code configuration: configuration/code.md
      - appsettings.json: configuration/appsettings.md
      - Providers and environments: configuration/providers.md
      - Best practices: configuration/best-practices.md
  - ASP.NET Core:
      - Integration and dependency injection: aspnet/integration.md
      - Request logging: aspnet/request-logging.md
      - Context and correlation: aspnet/context.md
  - Pipeline:
      - Enrichers: pipeline/enrichers.md
      - Filters: pipeline/filters.md
      - Sinks: sinks/overview.md
      - Console and file: sinks/console-file.md
      - Seq and Elasticsearch: sinks/centralized.md
      - Other sinks and custom sinks: sinks/other.md
  - Production:
      - Centralized logging: production/centralized.md
      - Performance and reliability: production/performance.md
      - Security and retention: production/security-retention.md
      - Practices and scenarios: production/practices.md
  - References: references.md
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/serilog/serilog
extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid-init.js
